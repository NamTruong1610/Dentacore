services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-dentacore}:${POSTGRES_PASSWORD:-dentacore}@postgres:5432/${POSTGRES_DB:-dentacore}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dentacore}:${RABBITMQ_PASSWORD:-dentacore}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Dentacore <no-reply@dentacore.local>}
      ACTIVATION_URL: ${ACTIVATION_URL:-http://localhost:5173/activate}
      TOTP_ISSUER: ${TOTP_ISSUER:-Dentacore}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentacore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentacore}
      POSTGRES_DB: ${POSTGRES_DB:-dentacore}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dentacore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dentacore}
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"       # AMQP
      - "${RABBITMQ_UI_PORT:-15673}:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Catches all outgoing email in development. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web inbox

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
